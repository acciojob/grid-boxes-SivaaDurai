
<!DOCTYPE html>
<html>
<head>
    <title>Grid Layout</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 85px 85px 85px 85px 85px;
            gap: 5px;
        }

        .box {
            background-color: green;
            color: white;
            font-size: 32px;
            padding: 5px;
        }

        .box1 {
            grid-column: 1 / 5;
        }

        .box2 {
            grid-column: 1;
            grid-row: 2 / 6;
        }

        .box3 {
            grid-column: 2;
            grid-row: 2;
        }

        .box4 {
            grid-column: 3 / 5;
            grid-row: 2;
        }

        .box5 {
            grid-column: 2 / 4;
            grid-row: 3;
        }

        .box6 {
            grid-column: 4;
            grid-row: 3;
        }

        .box7 {
            grid-column: 2;
            grid-row: 4;
        }

        .box8 {
            grid-column: 3;
            grid-row: 4;
        }

        .box9 {
            grid-column: 4;
            grid-row: 4;
        }

        .box10 {
            grid-column: 2 / 5;
            grid-row: 5;
        }
    </style>
</head>
<body>
    <p>Create the following layout using grid layout:</p>

    <div class="container">
        <div class="box box1">1</div>
        <div class="box box2">2</div>
        <div class="box box3">3</div>
        <div class="box box4">4</div>
        <div class="box box5">5</div>
        <div class="box box6">6</div>
        <div class="box box7">7</div>
        <div class="box box8">8</div>
        <div class="box box9">9</div>
        <div class="box box10">10</div>
    </div>
</body>
</html>
